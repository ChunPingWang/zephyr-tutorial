# ===== Wi-Fi 驅動與管理層 =====
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_WIFI_SHELL=y

# ===== 網路協定堆疊 =====
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y

# ===== 網路管理事件 =====
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

# ===== Shell（互動式指令列）=====
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_SHELL_STACK_SIZE=5200

# ===== 記憶體：Wi-Fi 驅動需要較大的堆疊與 heap =====
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=98304

# ===== 日誌 =====
CONFIG_NET_LOG=y
CONFIG_LOG=y
CONFIG_WIFI_LOG_LEVEL_ERR=y

# 註：若與你的 Zephyr 版本不合（Kconfig 更名等），
# 請比對 zephyr/samples/net/wifi/shell 的 prj.conf 與其 ESP32 板子設定。
